:root{--bg:#0B0B0D;--s1:#141417;--s2:#1C1C21;--s3:#24242A;--line:#2B2B32;--ink:#F5F2EA;--mute:#A7ADB6;--dim:#7E848D;
  --acc:#C9A227;--acc2:#E9CF7E;--accbg:rgba(201,162,39,.14);--accln:rgba(201,162,39,.45);--onacc:#0B0B0D;
  --red:#FF6B6B;--redbg:rgba(255,107,107,.12);--amb:#F2C14E;--ambbg:rgba(242,193,78,.12);--grn:#46C66B;--grnbg:rgba(70,198,107,.12)}
body.rose{--acc:#D9828F;--acc2:#F1B7BF;--accbg:rgba(217,130,143,.15);--accln:rgba(217,130,143,.5)}
html{background:var(--bg);scroll-padding-top:128px;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
body.large{font-size:18px}
a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
.t-xs{font-size:.75rem}.t-sm{font-size:.875rem}.t-md{font-size:1rem}.t-lg{font-size:1.125rem}.t-xl{font-size:1.375rem}.t-2xl{font-size:1.75rem}
.mute{color:var(--mute)}.dim{color:var(--dim)}.acc{color:var(--acc2)}.red{color:var(--red)}.grn{color:var(--grn)}.amb{color:var(--amb)}
.b{font-weight:700}.sb{font-weight:600}.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.eyebrow{font-size:.6875rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--mute)}
.one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.two{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* header */
.hdr{position:sticky;top:0;z-index:30;background:rgba(11,11,13,.95);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.brand{font-weight:800;letter-spacing:.16em;font-size:.95rem;color:var(--acc2);white-space:nowrap}
.ibtn{height:44px;min-width:44px;border-radius:14px;background:var(--s1);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--ink);padding:0 12px;font-weight:600;font-size:.875rem}
.ibtn:active{transform:scale(.97)}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:0 16px 10px;max-width:640px;margin:0 auto}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;height:36px;padding:0 14px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;font-size:.84rem;font-weight:600;color:var(--mute);border:1px solid transparent;position:relative}
.tab:after{content:"";position:absolute;inset:-4px 0}
.tab.on{color:var(--onacc);background:var(--acc)}
.tab .n{font-size:.7rem;opacity:.85}
.tab.warn:not(.on){color:var(--red)}
/* strip */
.strip{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;text-align:left;border-radius:20px;background:linear-gradient(180deg,var(--s2),var(--s1));border:1px solid var(--line);padding:14px 14px 13px;min-height:122px;display:flex;flex-direction:column;gap:2px;overflow:hidden;color:var(--ink);width:100%}
.tile:active{transform:scale(.985)}
.tile .ico{position:absolute;right:12px;top:12px;opacity:.9;color:var(--acc)}
.tile .eyebrow{padding-right:24px}
.tile .big{font-size:1.9rem;font-weight:800;line-height:1.05;letter-spacing:-.02em;margin-top:6px}
.tile .big.sm{font-size:1.05rem;line-height:1.2;font-weight:700}
.tile.hot{border-color:rgba(255,107,107,.5);background:linear-gradient(180deg,rgba(255,107,107,.13),var(--s1))}
.tile.goldt{border-color:var(--accln);background:linear-gradient(160deg,var(--accbg),var(--s1) 70%)}
.tile .foot{margin-top:auto;font-size:.78rem;color:var(--mute)}
/* sections */
.sec{padding-top:30px}
.sh{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sh h2{font-size:1.25rem;font-weight:800;letter-spacing:-.01em}
.pill{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:999px;font-size:.75rem;font-weight:700;background:var(--s2);border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.pill.acc{background:var(--accbg);border-color:var(--accln);color:var(--acc2)}
.pill.red{background:var(--redbg);border-color:rgba(255,107,107,.45);color:var(--red)}
.pill.amb{background:var(--ambbg);border-color:rgba(242,193,78,.45);color:var(--amb)}
.pill.grn{background:var(--grnbg);border-color:rgba(70,198,107,.45);color:var(--grn)}
.card{background:var(--s1);border:1px solid var(--line);border-radius:18px}
/* needs cards */
.nc{position:relative;padding:14px 14px 12px 18px;overflow:hidden}
.nc:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--line)}
.nc.u3:before{background:var(--red)}.nc.u2:before{background:var(--amb)}.nc.u1:before{background:var(--acc)}
.nc h3{font-size:1.02rem;font-weight:700;line-height:1.3}
.nc .why{margin-top:3px;font-size:.875rem;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}
.acts .ans{padding:0 12px;font-size:.84rem;flex:1 1 auto}
.btn{min-height:44px;padding:0 14px;border-radius:13px;background:var(--s2);border:1px solid var(--line);font-size:.875rem;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--ink)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.btn.on{background:var(--accbg);border-color:var(--acc);color:var(--acc2);box-shadow:inset 0 0 0 1px var(--acc)}
.btn.ghost{background:transparent}
.btn.sq{width:44px;padding:0}
.btn.full{width:100%}
.more{display:grid;grid-template-rows:0fr;transition:grid-template-rows .26s ease}
.more.open{grid-template-rows:1fr}
.more>div{overflow:hidden;min-height:0}
.chev{transition:transform .22s}.open>.chev,.chev.open{transform:rotate(180deg)}
.det{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:.875rem;color:var(--mute)}
.det pre{white-space:pre-wrap;font-family:inherit;font-size:.8rem;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:8px;max-height:340px;overflow:auto;color:var(--mute)}
.grp{margin-top:10px}
.gh{width:100%;min-height:52px;display:flex;align-items:center;gap:10px;padding:0 14px;border-radius:16px;background:var(--s1);border:1px solid var(--line);font-weight:700}
.stale{border-style:dashed}
.srow{display:flex;align-items:center;gap:10px;padding:10px 6px 10px 14px;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.srow.gone{opacity:.35}
/* lists */
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:56px;width:100%;text-align:left;color:var(--ink)}
.rows>*+*{border-top:1px solid var(--line)}
.dot{width:10px;height:10px;border-radius:99px;flex-shrink:0;background:var(--dim)}
.dot.green{background:var(--grn);box-shadow:0 0 0 4px var(--grnbg)}.dot.yellow{background:var(--amb);box-shadow:0 0 0 4px var(--ambbg)}.dot.red{background:var(--red);box-shadow:0 0 0 4px var(--redbg)}
.kv{display:grid;grid-template-columns:84px 1fr;gap:4px 10px;font-size:.84rem;margin-top:8px}
.kv dt{color:var(--dim)}.kv dd{color:var(--ink)}
/* numbers */
.ngrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nt{padding:13px 13px 12px;border-radius:18px;background:var(--s1);border:1px solid var(--line);display:flex;flex-direction:column;min-height:132px}
.nt.miss{background:transparent;border-style:dashed}
.nt .v{font-size:1.85rem;font-weight:800;letter-spacing:-.02em;line-height:1.05;margin-top:10px}
.nt.miss .v{font-size:.95rem;color:var(--dim);font-weight:700;margin-top:12px}
.up{color:var(--grn)}.dn{color:var(--red)}
.pf{width:26px;height:26px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:800;color:#fff;flex-shrink:0}
/* timeline */
.tl{position:relative;padding-left:4px}
.ti{position:relative;display:flex;gap:12px;padding:0 0 16px 0}
.ti:before{content:"";position:absolute;left:12px;top:30px;bottom:0;width:2px;background:var(--line)}
.ti:last-child:before{display:none}
.ti .when{font-size:.78rem;color:var(--acc2);font-weight:700}
.daylab{margin:14px 0 8px;font-size:.78rem;font-weight:700;color:var(--mute);letter-spacing:.06em;text-transform:uppercase}
.empty{padding:14px;border-radius:16px;border:1px dashed var(--line);color:var(--mute);font-size:.875rem}
/* sheet + toast */
.shade{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;opacity:0;transition:opacity .2s}
.shade.open{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:88vh;overflow-y:auto;background:var(--s1);border-top:1px solid var(--line);border-radius:24px 24px 0 0;padding:10px 20px calc(env(safe-area-inset-bottom) + 20px);transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1)}
.sheet.open{transform:none}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translate(-50%,20px);opacity:0;z-index:50;background:var(--s3);border:1px solid var(--line);color:var(--ink);border-radius:14px;padding:10px 14px;font-size:.875rem;font-weight:600;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.5);transition:all .22s;max-width:92vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast button{color:var(--acc2);font-weight:800;min-height:36px}
body.hasbar .toast{bottom:calc(env(safe-area-inset-bottom) + 104px)}
.ansbar{position:fixed;left:0;right:0;bottom:0;z-index:35;background:rgba(11,11,13,.94);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:12px 16px calc(env(safe-area-inset-bottom) + 12px)}
.spin{animation:sp .9s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.tog{position:relative;width:50px;height:30px;border-radius:9999px;background:var(--s3);border:1px solid var(--line);flex-shrink:0}
.tog:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:9999px;background:var(--mute);transition:transform .18s}
[aria-checked=true] .tog{background:var(--accbg);border-color:var(--acc)}
[aria-checked=true] .tog:after{transform:translateX(20px);background:var(--acc2)}
.pb{padding-bottom:calc(env(safe-area-inset-bottom) + 110px)}
.ribbon{font-size:.72rem;color:var(--mute);padding:10px 0 0}
.ribbon b{color:var(--acc2)}
.hidden{display:none!important}
a>span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
body.compact .why,body.compact .chips{display:none}
input.pw{width:100%;height:56px;border-radius:16px;background:var(--s1);border:1px solid var(--line);padding:0 16px;font-size:1.1rem;color:var(--ink)}
input.pw:focus{border-color:var(--acc);outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.fade-in{animation:fi .25s ease}@keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
</style>
</head>
<body>

<!-- LOCK -->
<main id="lock" class="min-h-screen flex items-center justify-center px-6">
  <form id="lockForm" class="w-full max-w-sm text-center" autocomplete="on">
    <img src="../logo-96.png" width="76" height="76" alt="" class="mx-auto mb-5 rounded-2xl">
    <h1 class="brand" style="font-size:1.5rem">JAY STEEL HQ</h1>
    <p class="mute t-sm mt-2 mb-7">Private. Enter your password to unlock.</p>
    <input type="text" name="username" value="JAY STEEL HQ" autocomplete="username" class="hidden" aria-hidden="true" tabindex="-1">
    <label for="pw" class="sr">Password</label>
    <input id="pw" class="pw" type="password" autocomplete="current-password" required placeholder="Password">
    <label class="flex items-center justify-center gap-3 mt-4 t-sm mute" style="min-height:44px"><input id="remember" type="checkbox" checked style="width:20px;height:20px;accent-color:#C9A227"> Remember this device</label>
    <button id="unlockBtn" type="submit" class="btn pri full mt-3" style="height:56px;font-size:1.05rem">Unlock</button>
    <p id="lockMsg" class="t-sm mt-4 red" style="min-height:1.5em" role="alert"></p>
  </form>
</main>

<!-- APP -->
<div id="app" class="hidden pb">
  <header class="hdr">
    <div class="wrap flex items-center gap-3" style="height:62px">
      <img src="../logo-96.png" width="34" height="34" alt="" class="rounded-lg">
      <div class="flex-1 min-w-0">
        <div class="brand">JAY STEEL HQ</div>
        <div id="updated" class="t-xs mute one" aria-live="polite">…</div>

  var k2=await crypto.subtle.importKey('raw',new TextEncoder().encode(tok),{name:'HMAC',hash:'SHA-256'},false,['sign']);var sig=hex(await crypto.subtle.sign('HMAC',k2,new TextEncoder().encode(L.join('\n'))));
  var body={_subject:'HQ answer'+(ids.length>1?'s ('+ids.length+')':'')+': '+ids.join(', ').slice(0,120),message:L.join('\n')+'\n\n'+ids.length+' answer(s) tapped in HQ preview at '+new Date().toISOString()+'\nsig: '+sig,_template:'box',_captcha:'false'};
  var ctl=new AbortController(),tm=setTimeout(function(){ctl.abort()},60000);
  var r=await fetch(INBOX,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(body),signal:ctl.signal,keepalive:true,credentials:'omit'});clearTimeout(tm);
  var j=await r.json().catch(function(){return {}});if(!r.ok||String(j.success)!=='true')throw new Error(j.message||('HTTP '+r.status));
  var SENT=load(K_SENT,{}),now=Date.now();ids.forEach(function(id){SENT[id]=now});save(K_SENT,SENT)}
function lines(){var A=load(K_ANS,{});return Object.keys(A).map(function(id){return 'HQ '+id+' \u2014 '+A[id].t+': '+A[id].o.join(' + ')})}
async function sendAns(){var A=load(K_ANS,{}),ids=Object.keys(A);if(!ids.length)return;var L=lines(),b=$('ansSend');b.disabled=true;$('ansMsg').textContent='Sending to Tab\u2026';
  try{await post(L,ids);save(K_ANS,{});$('ansMsg').textContent='Goes straight to Tab. You stay here.';toast('\u2713 Sent to Tab. Got it.');render(true)}
  catch(e){var a=$('ansMsg');a.textContent='';add(a,'Couldn\u2019t reach Tab ('+e.message+'). Saved here. ',link('https://wa.me/'+TAB_WA+'?text='+encodeURIComponent(L.join('\n')),'Send on WhatsApp','acc b'))}
  finally{b.disabled=false}}
/* ---------- settings ---------- */
function applyS(){var B=document.body;B.classList.toggle('large',!!S.large);B.classList.toggle('compact',!!S.compact);B.classList.toggle('rose',S.accent==='rose');
  document.querySelector('meta[name=theme-color]').setAttribute('content','#0B0B0D');
  $('cadence').textContent='Tab gathers fresh data on every scheduled run (Booker every 3 h, 6:30 AM brief, 10 AM Scout, 7 PM brief, 11:30 PM sync, and right after any inbox status change). This page re-pulls it '+(S.refreshMin>0?'every '+S.refreshMin+' min':'only when you tap Refresh')+' and recomputes deadlines, Today and Next 48 h every minute.'}
function saveS(){save(K_SET,S);applyS();if(st.key){render(true);stopTimers();clock=setInterval(function(){render(true)},60000);if(S.refreshMin>0)timer=setInterval(function(){refresh(false)},S.refreshMin*60000)}}
function toggle(label,sub,get,set){var b=el('button','w-full flex items-center gap-3 text-left');b.style.minHeight='56px';b.type='button';b.setAttribute('role','switch');
  var t=el('div','flex-1');add(t,el('div','sb',label));if(sub)add(t,el('div','t-xs mute mt-0.5',sub));add(b,t);add(b,el('span','tog'));
  b.setAttribute('aria-checked',get()?'true':'false');b.onclick=function(){set(!get());b.setAttribute('aria-checked',get()?'true':'false');saveS()};return b}
function seg(label,opts,get,set){var w=el('div');add(w,el('div','sb mb-2',label));var r=el('div','flex gap-2 flex-wrap');
  opts.forEach(function(o){var b=btn('btn'+(get()===o[0]?' on':''),o[1],function(){set(o[0]);r.querySelectorAll('button').forEach(function(x){x.classList.remove('on')});b.classList.add('on');saveS()});add(r,b)});add(w,r);return w}
function group(t){var g=el('div','card');g.style.cssText='padding:16px;display:grid;gap:12px;background:var(--bg)';add(g,el('div','eyebrow acc',t));return g}
function buildSettings(){var B=el('div');B.style.cssText='display:grid;gap:16px';
  var g3=ap(B,group('Needs You'));add(g3,seg('Cards on top',[[3,'Top 3'],[5,'Top 5'],[10,'Top 10']],function(){return S.topN},function(v){S.topN=v}));
  add(g3,toggle('Hide the stale drawer','asks overdue 7+ days or past their event date',function(){return S.hideStale},function(v){S.hideStale=v}));
  add(g3,toggle('Answer buttons','\u2705 / \u274C on each card, sent to Tab in one tap',function(){return S.answers},function(v){S.answers=v}));
  add(g3,toggle('Hide what I already answered','for 3 days after you send it',function(){return S.doneHidden},function(v){S.doneHidden=v}));
  var g4=ap(B,group('Look'));add(g4,seg('Accent',[['gold','Gold'],['rose','Rose']],function(){return S.accent},function(v){S.accent=v}));
  add(g4,toggle('Larger text',null,function(){return S.large},function(v){S.large=v}));
  add(g4,toggle('Compact cards','titles, deadlines and buttons only',function(){return S.compact},function(v){S.compact=v}));
  var g1=ap(B,group('Sections'));add(g1,el('p','t-xs mute','Show, hide or move sections. Kept on this phone.'));
  S.order.forEach(function(id,i){var sec=SECTIONS.filter(function(s){return s.id===id})[0];var r=el('div','flex items-center gap-2');
    var sw=toggle(sec.name,null,function(){return !S.hidden[id]},function(v){if(v)delete S.hidden[id];else S.hidden[id]=1});sw.classList.add('flex-1');add(r,sw);
    [['\u2191',-1],['\u2193',1]].forEach(function(m){var j=i+m[1];var b=btn('btn sq',m[0],function(){var o=S.order;o.splice(j,0,o.splice(i,1)[0]);saveS();openSettings()},'Move '+sec.name+(m[1]<0?' up':' down'));
      if(j<0||j>=S.order.length){b.disabled=true;b.style.opacity=.3}add(r,b)});add(g1,r)});
  add(g1,btn('btn ghost','Reset order',function(){S.order=DEF.order.slice();S.hidden={};saveS();openSettings()}));
  var g2=ap(B,group('Refresh'));add(g2,seg('Auto re-pull',[[0,'Off'],[5,'5 min'],[15,'15 min'],[30,'30 min']],function(){return S.refreshMin},function(v){S.refreshMin=v}));
  add(g2,el('p','t-xs mute','Re-pulls the encrypted files only. Tab gathers new data on every scheduled run (about every 3 h).'));
  var g6=ap(B,group('Data status'));FILES.forEach(function(n){var d=st.data[n],r=el('div','flex items-center gap-3 t-sm');add(r,el('span','dot '+(d?'green':'red')));add(r,el('span','flex-1',n+'.json'));add(r,el('span','mute t-xs',d?ago(d.generated_at):(st.err[n]||'missing')));add(g6,r)});
  var D=load(K_DIS,{});if(Object.keys(D).length)add(g6,btn('btn ghost','Show '+Object.keys(D).length+' dismissed stale item(s) again',function(){save(K_DIS,{});saveS();openSettings()}));
  var g5=ap(B,group('This device'));add(g5,toggle('Remember this device','stay unlocked on this phone',function(){return !!load(KEYNAME,null)},function(v){if(v&&st.key)save(KEYNAME,{salt:st.salt,key:b64e(st.key)});else localStorage.removeItem(KEYNAME)}));
  var lk=btn('btn full red','Lock now and forget this device',function(){closeSheet();lock('Locked.')});lk.style.borderColor='rgba(255,107,107,.5)';add(g5,lk);return B}
function openSettings(){var wasOpen=$('sheet').classList.contains('open');if(wasOpen){$('sheetTitle').textContent='Settings';var b=$('sheetBody'),y=$('sheet').scrollTop;b.textContent='';add(b,buildSettings());$('sheet').scrollTop=y}else openSheet('Settings',buildSettings())}
/* ---------- wire ---------- */
$('lockForm').addEventListener('submit',async function(e){e.preventDefault();var b=$('unlockBtn');b.disabled=true;b.textContent='Unlocking\u2026';$('lockMsg').textContent='';
  try{await unlock($('pw').value)}catch(err){$('lockMsg').textContent=err.message||'Could not unlock.'}finally{b.disabled=false;b.textContent='Unlock'}});
$('refreshBtn').onclick=function(){refresh(true)};$('lockBtn').onclick=function(){lock('Locked.')};
$('setBtn').onclick=openSettings;$('sheetDone').onclick=closeSheet;$('shade').onclick=closeSheet;
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('sheet').classList.contains('hidden'))closeSheet()});
$('ansSend').onclick=sendAns;$('ansClear').onclick=function(){save(K_ANS,{});render(true)};
document.addEventListener('visibilitychange',function(){if(!document.hidden&&st.key&&st.at&&Date.now()-new Date(st.at)>10*6e4)refresh(false)});
(async function(){applyS();var sv=load(KEYNAME,null);if(!sv||!sv.key){$('pw').focus();return}
  try{var blobs=await fetchAll(),b=firstBlob(blobs);if(!b)throw new Error('No data files reachable. Check your connection.');
    if(b.salt!==sv.salt){localStorage.removeItem(KEYNAME);$('lockMsg').textContent='Password changed. Unlock again.';return}
    st.key=b64d(sv.key).buffer;st.salt=sv.salt;await dec(b,st.key);await openAll(blobs,st.key);show()}
  catch(e){$('lockMsg').textContent=e.message&&e.message.indexOf('No data')===0?e.message:'Unlock again.';st.key=null}})();
})();

</script>
