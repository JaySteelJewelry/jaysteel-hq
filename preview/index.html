.dot.green{background:#3FB950;box-shadow:0 0 0 3px rgba(63,185,80,.18)}
.dot.yellow{background:#E3B341;box-shadow:0 0 0 3px rgba(227,179,65,.18)}
.dot.red{background:#F85149;box-shadow:0 0 0 3px rgba(248,81,73,.2)}

.sheet{transform:translateY(100%);transition:transform .22s ease}
.sheet.open{transform:none}
.spin{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.tog{position:relative;width:50px;height:30px;border-radius:9999px;background:#2A2A30;border:1px solid #3a3a42;flex-shrink:0}
.tog:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:9999px;background:#9AA1AA;transition:transform .18s}
[aria-checked=true] .tog{background:rgba(201,162,75,.3);border-color:#C9A24B}
[aria-checked=true] .tog:after{transform:translateX(20px);background:#E8CB7C}

<body class="bg-onyx text-ivory antialiased min-h-screen">

<!-- LOCK -->
<main id="lock" class="min-h-screen flex items-center justify-center px-6">
  <form id="lockForm" class="w-full max-w-sm text-center" autocomplete="on">
    <img src="../logo-96.png" width="72" height="72" alt="" class="mx-auto mb-5 rounded-2xl">
    <h1 class="text-2xl font-bold tracking-[0.18em] text-champagne">JAY STEEL HQ</h1>
    <p class="text-steel text-sm mt-2 mb-7">Private. Enter your password to unlock.</p>
    <input type="text" name="username" value="JAY STEEL HQ" autocomplete="username" class="hidden" aria-hidden="true" tabindex="-1">
    <label for="pw" class="sr-only">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required placeholder="Password"
      class="w-full h-14 rounded-2xl bg-card border border-line px-4 text-lg text-ivory placeholder-steel focus:border-gold outline-none">
    <label class="flex items-center justify-center gap-3 mt-4 text-sm text-steel min-h-[44px]"><input id="remember" type="checkbox" checked class="w-5 h-5 accent-[#C9A24B]"> Remember this device</label>
    <button id="unlockBtn" type="submit" class="w-full h-14 mt-3 rounded-2xl bg-gold text-onyx font-bold text-lg active:scale-[.99]">Unlock</button>
    <p id="lockMsg" class="text-sm mt-4 min-h-[1.5em] text-[#F85149]" role="alert"></p>
  </form>
</main>

<!-- APP -->
<div id="app" class="hidden pb">
  <header class="sticky top-0 z-20 bg-onyx/95 backdrop-blur border-b border-line" style="padding-top:env(safe-area-inset-top)">
    <div class="max-w-2xl mx-auto px-4 h-16 flex items-center gap-3">
      <img src="../logo-96.png" width="32" height="32" alt="" class="rounded-lg">
      <div class="flex-1 min-w-0">
        <div class="font-bold tracking-[0.14em] text-champagne text-[15px] leading-tight whitespace-nowrap">JAY STEEL HQ</div>
        <div id="updated" class="text-xs text-steel truncate" aria-live="polite">…</div>
      </div>
      <button id="refreshBtn" type="button" class="h-11 px-3 rounded-xl bg-card border border-line text-sm font-semibold text-ivory flex items-center gap-2" aria-label="Refresh data"><svg id="refIco" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Refresh</button>
      <button id="setBtn" type="button" class="h-11 w-11 rounded-xl bg-card border border-line flex items-center justify-center" aria-label="Settings"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E8CB7C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    </div>
    <nav id="jump" class="max-w-2xl mx-auto px-4 pb-3 flex gap-2 overflow-x-auto no-scrollbar text-sm"></nav>
  </header>

  <p class="max-w-2xl mx-auto px-4 pt-3 text-[11px] tracking-wide text-steel"><span class="text-champagne font-semibold">PREVIEW</span> · your live HQ stays as it is until you say “make it live”.</p>
  <main id="sections" class="max-w-2xl mx-auto px-4 pt-4 space-y-9"></main>

  <footer class="max-w-2xl mx-auto px-4 mt-10 text-xs text-steel space-y-2">
    <p id="cadence"></p>
    <p id="srcErr"></p>
    <button id="lockBtn" type="button" class="h-11 px-4 rounded-xl border border-line text-steel">Lock HQ</button>
  </footer>

  <div id="ansBar" class="hidden fixed inset-x-0 bottom-0 z-30 bg-onyx/95 border-t border-line px-4 pt-3" style="padding-bottom:calc(env(safe-area-inset-bottom) + 12px)">
    <div class="max-w-2xl mx-auto flex items-center gap-3">
      <button id="ansSend" type="button" class="flex-1 h-14 rounded-2xl bg-gold text-onyx font-bold text-base">Send answers to Tab <span id="ansN"></span></button>
      <button id="ansClear" type="button" class="h-14 px-4 rounded-2xl border border-line text-steel text-sm">Clear</button>
    </div>
    <p id="ansMsg" class="max-w-2xl mx-auto text-xs text-steel mt-2 text-center" role="status" aria-live="polite">Goes straight to Tab. You stay here.</p>
  </div>
</div>

<!-- SETTINGS -->
<div id="setWrap" class="hidden fixed inset-0 z-40">
  <div id="setShade" class="absolute inset-0 bg-black/60"></div>

    var body={_subject:'HQ answer'+(ids.length>1?'s ('+ids.length+')':'')+': '+ids.join(', ').slice(0,120),message:L.join('\n')+'\n\n'+ids.length+' answer(s) tapped in HQ preview at '+new Date().toISOString()+'\nsig: '+sig,_template:'box',_captcha:'false'};
    var ctl=new AbortController(),tm=setTimeout(function(){ctl.abort()},60000);
    var r=await fetch(INBOX,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(body),signal:ctl.signal,keepalive:true,credentials:'omit'});clearTimeout(tm);
    var j=await r.json().catch(function(){return {}});if(!r.ok||String(j.success)!=='true')throw new Error(j.message||('HTTP '+r.status));
    var SENT=load(K_SENT,{}),now=Date.now();ids.forEach(function(id){SENT[id]=now});save(K_SENT,SENT);save(K_ANS,{});$('ansMsg').textContent='\u2713 Sent to Tab. Got it.';render(true)}
  catch(e){var a=$('ansMsg');a.textContent='';add(a,document.createTextNode('Couldn\u2019t reach Tab ('+e.message+'). Saved here. '));add(a,link('https://wa.me/'+TAB_WA+'?text='+encodeURIComponent(L.join('\n')),'Send on WhatsApp','underline text-champagne'))}
  finally{btn.disabled=false}}

/* ---------- settings ---------- */
function applyS(){document.body.classList.toggle('large',!!S.large);document.body.classList.toggle('compact',!!S.compact);
  $('cadence').textContent='Data is gathered by Tab on every scheduled run (Booker every 3 h, 6:30 AM brief, 10 AM Scout, 7 PM brief, 11:30 PM sync, and right after any inbox status change). This page re-pulls it '+(S.refreshMin>0?'every '+S.refreshMin+' min':'only when you tap Refresh')+' and recomputes Today, Next 48 h and overdue every minute.'}
function saveS(){save(K_SET,S);applyS();render(true);if(st.key)show()}
function toggle(label,sub,get,set){var b=el('button','w-full flex items-center gap-3 min-h-[56px] text-left');b.type='button';b.setAttribute('role','switch');
  var t=el('div','flex-1');add(t,el('div','font-semibold',label));if(sub)add(t,el('div','text-xs text-steel mt-0.5',sub));add(b,t);add(b,el('span','tog'));
  b.setAttribute('aria-checked',get()?'true':'false');b.onclick=function(){set(!get());b.setAttribute('aria-checked',get()?'true':'false');saveS()};return b}
function seg(label,opts,get,set){var w=el('div','');add(w,el('div','font-semibold mb-2',label));var r=el('div','flex gap-2 flex-wrap');
  opts.forEach(function(o){var b=el('button','min-h-[44px] px-4 rounded-xl border border-line bg-onyx text-sm font-semibold',o[1]);b.type='button';if(get()===o[0])b.classList.add('chip-on');
    b.onclick=function(){set(o[0]);r.querySelectorAll('button').forEach(function(x){x.classList.remove('chip-on')});b.classList.add('chip-on');saveS()};add(r,b)});add(w,r);return w}
function group(t){var g=el('div','rounded-2xl bg-onyx border border-line p-4 space-y-3');add(g,el('div','text-xs uppercase tracking-[0.2em] text-gold font-semibold',t));return g}
function buildSettings(){var B=$('setBody');B.textContent='';
  var g1=ap(B,group('Sections'));add(g1,el('p','text-xs text-steel','Show, hide or move sections. Your order is kept on this phone.'));
  S.order.forEach(function(id,i){var sec=SECTIONS.filter(function(s){return s.id===id})[0];var r=el('div','flex items-center gap-2');
    var sw=toggle(sec.name,null,function(){return !S.hidden[id]},function(v){if(v)delete S.hidden[id];else S.hidden[id]=1});sw.classList.add('flex-1');add(r,sw);
    [['\u2191',-1],['\u2193',1]].forEach(function(m){var b=el('button','h-11 w-11 rounded-xl border border-line text-champagne text-lg',m[0]);b.type='button';b.setAttribute('aria-label','Move '+sec.name+(m[1]<0?' up':' down'));
      var j=i+m[1];if(j<0||j>=S.order.length)b.disabled=true,b.classList.add('opacity-30');b.onclick=function(){var o=S.order;o.splice(j,0,o.splice(i,1)[0]);saveS();buildSettings()};add(r,b)});add(g1,r)});
  var rs=el('button','min-h-[44px] text-sm text-champagne','Reset order');rs.type='button';rs.onclick=function(){S.order=DEF.order.slice();S.hidden={};saveS();buildSettings()};add(g1,rs);
  var g2=ap(B,group('Refresh'));add(g2,seg('Auto re-pull data',[[0,'Off'],[5,'5 min'],[15,'15 min'],[30,'30 min']],function(){return S.refreshMin},function(v){S.refreshMin=v}));
  add(g2,el('p','text-xs text-steel','Re-pulls the encrypted files only. Tab gathers new data on every scheduled run (about every 3 h).'));
  var g3=ap(B,group('Needs You'));add(g3,seg('Cards shown first',[[6,'6'],[10,'10'],[0,'All']],function(){return S.needsShow},function(v){S.needsShow=v}));
  add(g3,toggle('Answer buttons','\u2705 / \u274C chips on each card, sent to Tab in one tap',function(){return S.answers},function(v){S.answers=v}));
  add(g3,toggle('Hide what I already answered','for 3 days after you send it',function(){return S.doneHidden},function(v){S.doneHidden=v}));
  var g4=ap(B,group('Display'));add(g4,toggle('Larger text',null,function(){return S.large},function(v){S.large=v}));
  add(g4,toggle('Compact','hide the explanations, keep titles, actions and numbers',function(){return S.compact},function(v){S.compact=v}));
  var g5=ap(B,group('This device'));add(g5,toggle('Remember this device','stay unlocked on this phone',function(){return !!load(KEYNAME,null)},function(v){if(v&&st.key)save(KEYNAME,{salt:st.salt,key:b64e(st.key)});else localStorage.removeItem(KEYNAME)}));
  var lk=el('button','w-full min-h-[48px] rounded-xl border border-[#F85149]/60 text-[#F85149] font-semibold','Lock now and forget this device');lk.type='button';lk.onclick=function(){closeS();lock('Locked.')};add(g5,lk)}
function openS(){buildSettings();$('setWrap').classList.remove('hidden');requestAnimationFrame(function(){$('sheet').classList.add('open')});$('setDone').focus()}
function closeS(){$('sheet').classList.remove('open');setTimeout(function(){$('setWrap').classList.add('hidden')},220)}

/* ---------- wire ---------- */
$('lockForm').addEventListener('submit',async function(e){e.preventDefault();var b=$('unlockBtn');b.disabled=true;b.textContent='Unlocking\u2026';$('lockMsg').textContent='';
  try{await unlock($('pw').value)}catch(err){$('lockMsg').textContent=err.message||'Could not unlock.'}finally{b.disabled=false;b.textContent='Unlock'}});
$('refreshBtn').onclick=function(){refresh(true)};$('lockBtn').onclick=function(){lock('Locked.')};
$('setBtn').onclick=openS;$('setDone').onclick=closeS;$('setShade').onclick=closeS;
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('setWrap').classList.contains('hidden'))closeS()});
$('ansSend').onclick=sendAns;$('ansClear').onclick=function(){save(K_ANS,{});render(true)};
document.addEventListener('visibilitychange',function(){if(!document.hidden&&st.key&&st.at&&Date.now()-new Date(st.at)>10*6e4)refresh(false)});
(async function(){var sv=load(KEYNAME,null);if(!sv||!sv.key){$('pw').focus();return}
  try{var blobs=await fetchAll(),b=firstBlob(blobs);if(!b)throw new Error('No data files reachable. Check your connection.');
    if(b.salt!==sv.salt){localStorage.removeItem(KEYNAME);$('lockMsg').textContent='Password changed. Unlock again.';return}
    st.key=b64d(sv.key).buffer;st.salt=sv.salt;await dec(b,st.key);await openAll(blobs,st.key);show()}
  catch(e){$('lockMsg').textContent=e.message&&e.message.indexOf('No data')===0?e.message:'Unlock again.';st.key=null}})();
})();
</script>
