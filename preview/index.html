:root{color-scheme:dark;
  --bg:#13151B;--bg2:#181B22;--s1:#1E2129;--s2:#252933;--s3:#2E333E;--line:#2C313B;--line2:#373D49;
  --ink:#ECE8E1;--mute:#9AA0A8;--dim:#858B95;
  --acc:#CFA93A;--acc2:#E8CD80;--accbg:rgba(207,169,58,.13);--accln:rgba(207,169,58,.42);--onacc:#15171C;
  --red:#EF8080;--redbg:rgba(239,128,128,.12);--redln:rgba(239,128,128,.42);
  --amb:#E9BC62;--ambbg:rgba(233,188,98,.12);--ambln:rgba(233,188,98,.40);
  --grn:#66CC92;--grnbg:rgba(102,204,146,.12);--grnln:rgba(102,204,146,.40);
  --glass:rgba(19,21,27,.94);--shadow:0 1px 0 rgba(255,255,255,.035) inset,0 6px 18px rgba(0,0,0,.22);--shadow2:0 12px 32px rgba(0,0,0,.45);
  --glow:radial-gradient(900px 420px at 50% -180px,rgba(207,169,58,.085),transparent 70%)}
body.rose{--acc:#D9828F;--acc2:#F0B6BE;--accbg:rgba(217,130,143,.14);--accln:rgba(217,130,143,.48);--glow:radial-gradient(900px 420px at 50% -180px,rgba(217,130,143,.08),transparent 70%)}
html.light{color-scheme:light;background:#F5F2EB}
html.light body,body.light{--bg:#F5F2EB;--bg2:#EFEBE2;--s1:#FFFFFF;--s2:#F3EFE7;--s3:#E8E3D8;--line:#E2DCCF;--line2:#D6CFBF;
  --ink:#1B1C20;--mute:#575D68;--dim:#666C77;
  --acc:#C9A227;--acc2:#7E5F0A;--accbg:rgba(201,162,39,.14);--accln:rgba(176,140,30,.5);--onacc:#1B1C20;
  --red:#B8312F;--redbg:rgba(184,49,47,.08);--redln:rgba(184,49,47,.38);
  --amb:#94600A;--ambbg:rgba(201,140,20,.11);--ambln:rgba(176,120,10,.4);
  --grn:#1D7A45;--grnbg:rgba(29,122,69,.09);--grnln:rgba(29,122,69,.36);
  --glass:rgba(245,242,235,.94);--shadow:0 1px 2px rgba(40,30,10,.05),0 4px 14px rgba(40,30,10,.05);--shadow2:0 12px 32px rgba(40,30,10,.18);
  --glow:radial-gradient(900px 420px at 50% -180px,rgba(201,162,39,.10),transparent 70%)}
html.light body.rose,body.light.rose{--acc:#D9828F;--acc2:#9E4352;--accbg:rgba(217,130,143,.14);--accln:rgba(190,100,115,.5);--glow:radial-gradient(900px 420px at 50% -180px,rgba(217,130,143,.10),transparent 70%)}
html{background:#13151B;scroll-padding-top:128px;-webkit-text-size-adjust:100%}
body{background:var(--glow) no-repeat,var(--bg);background-attachment:fixed;min-height:100vh;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
body.large{font-size:18px}
a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
.t-xs{font-size:.75rem}.t-sm{font-size:.875rem}.t-md{font-size:1rem}.t-lg{font-size:1.125rem}.t-xl{font-size:1.375rem}.t-2xl{font-size:1.75rem}
.mute{color:var(--mute)}.dim{color:var(--dim)}.acc{color:var(--acc2)}.red{color:var(--red)}.grn{color:var(--grn)}.amb{color:var(--amb)}
.b{font-weight:700}.sb{font-weight:600}.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.eyebrow{font-size:.6875rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--mute)}
.one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.two{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* header */
.hdr{position:sticky;top:0;z-index:30;background:var(--glass);box-shadow:0 8px 24px rgba(0,0,0,.12);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.brand{font-weight:800;letter-spacing:.18em;font-size:.95rem;color:var(--acc2);white-space:nowrap}
.ibtn{height:44px;min-width:44px;border-radius:14px;background:var(--s2);border:1px solid var(--line2);display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--ink);padding:0 12px;font-weight:600;font-size:.875rem}
.ibtn:active{transform:scale(.97)}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:0 16px 10px;max-width:640px;margin:0 auto}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;height:36px;padding:0 14px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;font-size:.84rem;font-weight:600;color:var(--mute);background:var(--s1);border:1px solid var(--line);position:relative;transition:background .18s,color .18s}
.tab:after{content:"";position:absolute;inset:-4px 0}
.tab.on{color:var(--onacc);background:var(--acc);border-color:var(--acc);box-shadow:0 4px 14px var(--accbg)}
.tab .n{font-size:.7rem;opacity:.85}
.tab.warn:not(.on){color:var(--red)}
/* strip */
.strip{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;text-align:left;border-radius:20px;background:linear-gradient(180deg,var(--s2),var(--s1));border:1px solid var(--line);box-shadow:var(--shadow);padding:14px 14px 13px;min-height:122px;display:flex;flex-direction:column;gap:2px;overflow:hidden;color:var(--ink);width:100%}
.tile:active{transform:scale(.985)}
.tile .ico{position:absolute;right:12px;top:12px;opacity:.9;color:var(--acc)}
.tile .eyebrow{padding-right:24px}
.tile .big{font-size:1.9rem;font-weight:800;line-height:1.05;letter-spacing:-.02em;margin-top:6px}
.tile .big.sm{font-size:1.05rem;line-height:1.2;font-weight:700}
.tile.hot{border-color:var(--redln);background:linear-gradient(180deg,var(--redbg),var(--s1))}
.tile.goldt{border-color:var(--accln);background:linear-gradient(160deg,var(--accbg),var(--s1) 70%)}
.tile .foot{margin-top:auto;font-size:.78rem;color:var(--mute)}
/* sections */
.sec{padding-top:30px}
.sh{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sh h2{font-size:1.25rem;font-weight:800;letter-spacing:-.01em}
.pill{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:999px;font-size:.75rem;font-weight:700;background:var(--s2);border:1px solid var(--line2);color:var(--mute);white-space:nowrap}
.pill.acc{background:var(--accbg);border-color:var(--accln);color:var(--acc2)}
.pill.red{background:var(--redbg);border-color:var(--redln);color:var(--red)}
.pill.amb{background:var(--ambbg);border-color:var(--ambln);color:var(--amb)}
.pill.grn{background:var(--grnbg);border-color:var(--grnln);color:var(--grn)}
.card{background:var(--s1);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
/* needs cards */
.nc{position:relative;padding:14px 14px 12px 18px;overflow:hidden}
.nc:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--line2)}
.nc.u3:before{background:var(--red)}.nc.u2:before{background:var(--amb)}.nc.u1:before{background:var(--acc)}
.nc h3{font-size:1.02rem;font-weight:700;line-height:1.3}
.nc .why{margin-top:3px;font-size:.875rem;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}
.acts .ans{padding:0 12px;font-size:.84rem;flex:1 1 auto}
.btn{min-height:44px;padding:0 14px;border-radius:13px;background:var(--s2);border:1px solid var(--line2);transition:background .15s,border-color .15s,color .15s;font-size:.875rem;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--ink)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--onacc);box-shadow:0 4px 14px var(--accbg)}
.btn.on{background:var(--accbg);border-color:var(--acc);color:var(--acc2);box-shadow:inset 0 0 0 1px var(--acc)}
.btn.ghost{background:transparent}
.btn.sq{width:44px;padding:0}
.btn.full{width:100%}
.more{display:grid;grid-template-rows:0fr;transition:grid-template-rows .26s ease}
.more.open{grid-template-rows:1fr}
.more>div{overflow:hidden;min-height:0}
.chev{transition:transform .22s}.open>.chev,.chev.open{transform:rotate(180deg)}
.det{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:.875rem;color:var(--mute)}
.det pre{white-space:pre-wrap;font-family:inherit;font-size:.8rem;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:8px;max-height:340px;overflow:auto;color:var(--mute)}
.grp{margin-top:10px}
.gh{width:100%;min-height:52px;display:flex;align-items:center;gap:10px;padding:0 14px;border-radius:16px;background:var(--s1);border:1px solid var(--line);font-weight:700;color:var(--ink);box-shadow:var(--shadow)}
.stale{border-style:dashed}
.srow{display:flex;align-items:center;gap:10px;padding:10px 6px 10px 14px;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.srow.gone{opacity:.35}
/* lists */
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:56px;width:100%;text-align:left;color:var(--ink)}
.rows>*+*{border-top:1px solid var(--line)}
.dot{width:10px;height:10px;border-radius:99px;flex-shrink:0;background:var(--dim)}
.dot.green{background:var(--grn);box-shadow:0 0 0 4px var(--grnbg)}.dot.yellow{background:var(--amb);box-shadow:0 0 0 4px var(--ambbg)}.dot.red{background:var(--red);box-shadow:0 0 0 4px var(--redbg)}
.kv{display:grid;grid-template-columns:84px 1fr;gap:4px 10px;font-size:.84rem;margin-top:8px}
.kv dt{color:var(--dim)}.kv dd{color:var(--ink)}
/* numbers */
.ngrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nt{padding:13px 13px 12px;border-radius:18px;background:linear-gradient(180deg,var(--s2),var(--s1));border:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:132px}
.nt.miss{background:transparent;border-style:dashed;box-shadow:none}
.nt .v{font-size:1.85rem;font-weight:800;letter-spacing:-.02em;line-height:1.05;margin-top:10px}
.nt.miss .v{font-size:.95rem;color:var(--dim);font-weight:700;margin-top:12px}
.up{color:var(--grn)}.dn{color:var(--red)}
.pf{width:26px;height:26px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:800;color:#fff;flex-shrink:0}
/* timeline */
.tl{position:relative;padding-left:4px}
.ti{position:relative;display:flex;gap:12px;padding:0 0 16px 0}
.ti:before{content:"";position:absolute;left:12px;top:30px;bottom:0;width:2px;background:var(--line)}
.ti:last-child:before{display:none}
.ti .when{font-size:.78rem;color:var(--acc2);font-weight:700}
.daylab{margin:14px 0 8px;font-size:.78rem;font-weight:700;color:var(--mute);letter-spacing:.06em;text-transform:uppercase}
.empty{padding:14px;border-radius:16px;border:1px dashed var(--line);color:var(--mute);font-size:.875rem}
/* sheet + toast */
.shade{position:fixed;inset:0;background:rgba(6,7,10,.62);z-index:40;opacity:0;transition:opacity .2s}
.shade.open{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:88vh;overflow-y:auto;background:var(--bg2);border-top:1px solid var(--line2);box-shadow:var(--shadow2);border-radius:24px 24px 0 0;padding:10px 20px calc(env(safe-area-inset-bottom) + 20px);transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1)}
.sheet.open{transform:none}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line2);margin:0 auto 14px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translate(-50%,20px);opacity:0;z-index:50;background:var(--s3);border:1px solid var(--line);color:var(--ink);border-radius:14px;padding:10px 14px;font-size:.875rem;font-weight:600;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow2);transition:all .22s;max-width:92vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast button{color:var(--acc2);font-weight:800;min-height:36px}
body.hasbar .toast{bottom:calc(env(safe-area-inset-bottom) + 104px)}
.ansbar{position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--glass);box-shadow:0 -8px 24px rgba(0,0,0,.18);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:12px 16px calc(env(safe-area-inset-bottom) + 12px)}
.spin{animation:sp .9s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.tog{position:relative;width:50px;height:30px;border-radius:9999px;background:var(--s3);border:1px solid var(--line2);flex-shrink:0}
.tog:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:9999px;background:var(--mute);transition:transform .18s}

  M.addEventListener('touchend',function(e){if(!ok)return;ok=false;var t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Date.now()-t0>700||Math.abs(dx)<70||Math.abs(dx)<Math.abs(dy)*1.8)return;
    var i=ORDER.indexOf(UI.page)+(dx<0?1:-1);if(i>=0&&i<ORDER.length)go(ORDER[i])},{passive:true});
  var sh=$('sheet'),gy=0,dragging=false;
  sh.addEventListener('touchstart',function(e){if(sh.scrollTop>0)return;gy=e.touches[0].clientY;dragging=true},{passive:true});
  sh.addEventListener('touchmove',function(e){if(!dragging)return;var d=e.touches[0].clientY-gy;if(d>0&&sh.scrollTop<=0){sh.style.transition='none';sh.style.transform='translateY('+d+'px)'}},{passive:true});
  sh.addEventListener('touchend',function(e){if(!dragging)return;dragging=false;var d=e.changedTouches[0].clientY-gy;sh.style.transition='';if(d>110&&sh.scrollTop<=0)closeSheet();else sh.style.transform=''},{passive:true})}

(async function(){applyS();var sv=load(KEYNAME,null);if(!sv||!sv.key){$('pw').focus();return}
  try{var blobs=await fetchAll(),b=firstBlob(blobs);if(!b)throw new Error('No data files reachable. Check your connection.');
    if(b.salt!==sv.salt){localStorage.removeItem(KEYNAME);$('lockMsg').textContent='Password changed. Unlock again.';return}
    st.key=b64d(sv.key).buffer;st.salt=sv.salt;await dec(b,st.key);await openAll(blobs,st.key);show()}
  catch(e){$('lockMsg').textContent=e.message&&e.message.indexOf('No data')===0?e.message:'Unlock again.';st.key=null}})();
