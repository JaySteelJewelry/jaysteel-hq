</main>

async function unlockWith(pw){
  var blob=await fetchBlob();
  var raw=await deriveRaw(pw,b64d(blob.salt),blob.iter);
  var data=await decryptBlob(blob,raw);
  state.key=raw;state.salt=blob.salt;
  if($('remember').checked){localStorage.setItem(KEYNAME,JSON.stringify({salt:blob.salt,key:b64e(raw)}))}
  show(data);
}
async function refresh(silent){
  var btn=$('refreshBtn');btn.disabled=true;btn.textContent='…';
  try{
    var blob=await fetchBlob();
    if(blob.salt!==state.salt){lock('Password changed. Unlock again.');return}
    show(await decryptBlob(blob,state.key));
  }catch(e){if(!silent)$('updated').textContent='Refresh failed ('+e.message+'). Showing last data.'}
  finally{btn.disabled=false;btn.textContent='Refresh'}
}
function lock(msg){localStorage.removeItem(KEYNAME);state={data:null,key:null,salt:null};
  ['needs','today','agents','numbers','posts','next'].forEach(function(id){$(id).textContent=''});
  $('app').classList.add('hidden');$('lock').classList.remove('hidden');$('lockMsg').textContent=msg||'';$('pw').value=''}

/* ---------- rendering ---------- */
function missing(box,what,info){box.textContent='';add(box,el('div','rounded-xl border border-dashed border-line p-4 text-sm text-steel','Data missing: '+what+(info&&info.error?' ('+info.error+')':'')))}
function empty(box,text,sub){var d=el('div','rounded-xl bg-card border border-line p-4');add(d,el('div','text-sm text-ivory',text));if(sub)add(d,el('div','text-sm text-steel mt-1',sub));add(box,d)}
function linkBtn(href,label){if(!href)return null;var a=el('a','mt-3 inline-flex items-center justify-center h-11 px-4 rounded-xl bg-gold/15 text-champagne text-sm font-semibold border border-gold/40 active:bg-gold/25',label||'Open \u2192');a.href=href;a.target='_blank';a.rel='noopener noreferrer';return a}
function ok(f){return f&&!f.missing}

function renderNeeds(f){var box=$('needs');box.textContent='';
  if(!ok(f)){missing(box,'needs_you.json',f);$('n-needs').textContent='';return}
  var items=f.items||[];$('n-needs').textContent=items.length||'';
  if(!items.length){empty(box,'Nothing needs you right now.');return}
  items.forEach(function(it){
    var overdue=it.deadline&&new Date(it.deadline)<new Date();
    var soon=!overdue&&it.deadline&&(new Date(it.deadline)-Date.now())<72*3600e3;
    var c=el('article','rounded-2xl p-4 border '+(overdue?'bg-red-950/60 border-red-500/70':'bg-card border-line'));
    var top=el('div','flex items-start gap-3');
    add(top,el('h3','flex-1 text-base font-semibold leading-snug '+(overdue?'text-red-200':'text-ivory'),it.title));
    if(it.count>1)add(top,el('span','text-xs px-2 py-1 rounded-full bg-white/10','\u00d7'+it.count));
    add(c,top);
    var dl;
    if(it.deadline){dl=el('div','mt-2 inline-flex text-xs font-semibold px-2.5 py-1 rounded-full '+(overdue?'bg-red-500 text-white':soon?'bg-amber-400 text-onyx':'bg-white/10 text-ivory'),
      (overdue?'OVERDUE \u00b7 was due ':'Due ')+fDay(it.deadline)+(overdue?'':' \u00b7 '+until(it.deadline))+(it.deadline_note?' \u00b7 '+it.deadline_note:''))}
    else{dl=el('div','mt-2 inline-flex text-xs px-2.5 py-1 rounded-full bg-white/5 text-steel',it.deadline_note||'No deadline set')}
    add(c,dl);
    if(it.action){var a=el('p','mt-3 text-sm leading-relaxed');add(a,el('span','text-gold font-semibold','Do: '),document.createTextNode(it.action));add(c,a)}
    var row=el('div','flex flex-wrap items-center gap-x-4');add(row,linkBtn(it.link,it.link_label));
    if(it.why){var dd=el('details','mt-3 w-full group');var sm=el('summary','cursor-pointer list-none text-xs text-steel py-2 select-none','Why it matters \u25BE');add(dd,sm,el('p','text-sm text-ivory/80 leading-relaxed pt-1',it.why));if(overdue)dd.open=true;add(row,dd)}
    add(c,row);
    add(box,c);
  });
}
function evRow(e){var d=el('div','rounded-xl bg-card border border-line p-3 flex gap-3 items-start');
  var t=el('div','w-20 shrink-0 text-sm font-semibold text-gold',e.all_day?'All day':fTime(e.start));
  var b=el('div','flex-1 min-w-0');add(b,el('div','text-sm font-semibold text-ivory',e.title));
  var meta=[];if(!e.all_day&&e.end)meta.push('until '+fTime(e.end));if(e.where)meta.push(e.where);if(e.status)meta.push(e.status);
  if(meta.length)add(b,el('div','text-xs text-steel mt-0.5',meta.join(' \u00b7 ')));
  if(e.sources&&e.sources.length>1)add(b,el('div','text-[11px] text-steel/70 mt-0.5','on '+e.sources.join(' + ')));
  if(e.link){var a=el('a','text-xs text-champagne underline mt-1 inline-block py-1','Details');a.href=e.link;a.target='_blank';a.rel='noopener noreferrer';add(b,a)}
  return add(d,t,b)}
function renderToday(f){var box=$('today');box.textContent='';
  if(!ok(f)){missing(box,'schedule.json',f);return}
  var it=f.today||[];if(!it.length){empty(box,'Nothing goes live today ('+(f.today_label||'')+').','No markets, events or posts on the calendar today.');return}
  it.forEach(function(e){add(box,evRow(e))});
}
function renderNext(f){var box=$('next');box.textContent='';
  if(!ok(f)){missing(box,'schedule.json',f);return}
  var it=f.next_48h||[];
  if(!it.length){var nu=f.next_up;empty(box,'Nothing scheduled in the next 48 h.',nu?('Next up: '+nu.title+' \u00b7 '+(nu.all_day?fDay(nu.start):fDayTime(nu.start))+(nu.where?' \u00b7 '+nu.where:'')):'Nothing further on the calendar.');return}
  var lastDay='';it.forEach(function(e){var dd=fDay(e.start);if(dd!==lastDay){add(box,el('div','text-xs uppercase tracking-wider text-steel pt-2',dd));lastDay=dd}add(box,evRow(e))});
}
var DOT={green:'bg-emerald-400',yellow:'bg-amber-400',red:'bg-red-500'};
function renderAgents(f){var box=$('agents');box.textContent='';
  if(!ok(f)){missing(box,'agents.json',f);return}
  (f.agents||[]).forEach(function(a){
    var c=el('article','rounded-2xl bg-card border border-line p-4');
    var top=el('div','flex items-center gap-3');
    add(top,el('span','w-3 h-3 rounded-full shrink-0 '+(DOT[a.health]||'bg-steel')),el('h3','flex-1 text-sm font-semibold text-ivory',a.name),el('span','text-[11px] uppercase tracking-wider '+(a.health==='green'?'text-emerald-300':a.health==='yellow'?'text-amber-300':'text-red-300'),a.health_label||a.health));
    add(c,top);
    if(a.what)add(c,el('p','text-xs text-steel mt-1.5 leading-relaxed',a.what));
    var g=el('dl','grid grid-cols-3 gap-2 mt-3 text-xs');
    function cell(k,v,s){var d=el('div','min-w-0');add(d,el('dt','text-steel/80',k),el('dd','text-ivory font-medium break-words',v||'\u2014'));if(s)add(d,el('dd','text-steel',s));return d}
    add(g,cell('Last run',a.last_run?fDayTime(a.last_run):(a.last_run_text||'never'),a.last_run?ago(a.last_run):''),
          cell('Result',a.last_result),
          cell('Next run',a.next_run?fTime(a.next_run):(a.next_run_text||'\u2014'),a.next_run?(fDay(a.next_run)+' \u00b7 '+until(a.next_run)):''));
    add(c,g);add(box,c);
  });
}
function num(v){return (v===null||v===undefined)?null:(typeof v==='number'?v.toLocaleString('en-US'):String(v))}
function delta(v){if(v===null||v===undefined)return '';if(v===0)return '\u00b10';return (v>0?'+':'')+v.toLocaleString('en-US')}
function renderNumbers(f){var box=$('numbers');box.textContent='';
  if(!ok(f)){missing(box,'stats.json',f);return}
  (f.accounts||[]).forEach(function(a){
    var c=el('article','rounded-2xl bg-card border border-line p-4'+(a.connected?'':' opacity-70'));
    var top=el('div','flex items-baseline gap-2');add(top,el('h3','text-sm font-semibold text-ivory',a.platform),el('span','text-xs text-steel truncate',a.handle||''));add(c,top);
    if(!a.connected){add(c,el('p','text-xs text-steel mt-2',a.note||'not connected'));add(box,c);return}
    var g=el('div','grid grid-cols-3 gap-2 mt-3');
    function stat(label,v,d,na){var s=el('div','min-w-0');add(s,el('div','text-[11px] text-steel',label));
      add(s,el('div','text-lg font-semibold '+(v==null?'text-steel text-sm':'text-ivory'),v==null?(na||'not available'):v));
      if(d)add(s,el('div','text-[11px] '+(d.charAt(0)==='+'?'text-emerald-300':d.charAt(0)==='-'?'text-red-300':'text-steel'),d));return s}
    add(g,stat('Followers',num(a.followers),a.followers_delta!=null?delta(a.followers_delta)+' since last build':''),
          stat(a.views_label_48h||'Views 48 h',num(a.views_48h),a.views_48h_delta!=null?delta(a.views_48h_delta):''),
          stat(a.views_label_7d||'Views 7 d',num(a.views_7d),a.views_7d_delta!=null?delta(a.views_7d_delta):''));
    add(c,g);if(a.note)add(c,el('p','text-[11px] text-steel mt-2',a.note));
    if(a.url){var l=el('a','text-xs text-champagne underline inline-block mt-1 py-1','Open profile');l.href=a.url;l.target='_blank';l.rel='noopener noreferrer';add(c,l)}
    add(box,c);
  });
  if(f.previous_build_at)add(box,el('p','text-[11px] text-steel sm:col-span-2','Change = since the build at '+fDayTime(f.previous_build_at)+'.'));
}
function renderPosts(f){var box=$('posts');box.textContent='';
  if(!ok(f)){missing(box,'posts.json',f);return}
  var it=f.posts||[];
  if(!it.length){empty(box,'No posts in the last 24 h.',(f.last_post?('Last post: '+f.last_post.platform+' \u00b7 '+fDay(f.last_post.time)+' ('+ago(f.last_post.time)+')'):'')+(f.checked&&f.checked.length?(f.last_post?' \u00b7 ':'')+'Checked '+f.checked.join(', '):''));return}
  it.forEach(function(p){var d=el('a','rounded-xl bg-card border border-line p-3 flex gap-3 items-center active:bg-white/5');d.href=p.link;d.target='_blank';d.rel='noopener noreferrer';
    add(d,el('span','w-20 shrink-0 text-sm font-semibold text-gold',p.platform),el('span','flex-1 text-sm text-ivory truncate',p.title||'Post'),el('span','text-xs text-steel shrink-0',fTime(p.time)+(p.count>1?' \u00d7'+p.count:'')));add(box,d)});
}
function show(data){
  state.data=data;$('lock').classList.add('hidden');$('app').classList.remove('hidden');
  var f=data.files||{};
  renderNeeds(f['needs_you.json']);renderToday(f['schedule.json']);renderAgents(f['agents.json']);
  renderNumbers(f['stats.json']);renderPosts(f['posts.json']);renderNext(f['schedule.json']);
  tick();
  var notes=data.unavailable||[];
  $('footnote').textContent=(notes.length?('Not available this build: '+notes.join(' \u00b7 ')+'. '):'')+'Times are Eastern (Jacksonville).';
}
function tick(){if(state.data&&state.data.generated_at)$('updated').textContent='Updated '+ago(state.data.generated_at)+' \u00b7 '+fTime(state.data.generated_at)}
setInterval(tick,30000);

$('lockForm').addEventListener('submit',async function(ev){ev.preventDefault();var b=$('unlockBtn');b.disabled=true;b.textContent='Unlocking…';$('lockMsg').textContent='';
  try{await unlockWith($('pw').value)}catch(e){$('lockMsg').textContent=(e&&e.name==='OperationError')?'Wrong password.':'Could not unlock: '+(e.message||e)}
  finally{b.disabled=false;b.textContent='Unlock'}});
$('refreshBtn').addEventListener('click',function(){refresh(false)});
$('lockBtn').addEventListener('click',function(){lock('')});
document.addEventListener('visibilitychange',function(){if(!document.hidden&&state.key)refresh(true)});

(async function boot(){var s=saved();if(!s)return;
  try{var blob=await fetchBlob();if(blob.salt!==s.salt){lock('Password changed. Unlock again.');return}
    var raw=b64d(s.key);var data=await decryptBlob(blob,raw);state.key=raw;state.salt=blob.salt;show(data)}
  catch(e){if(e&&e.name==='OperationError')lock('Saved key no longer works. Unlock again.');else $('lockMsg').textContent='Offline? '+(e.message||e)}
})();
})();
</script>
</body>
</html>
